site_name: ReDimNet2 ONNX
site_description: ReDimNet2 speaker verification with ONNX
site_url: https://mediainbox.github.io/redimnet2-onnx/
repo_url: https://github.com/mediainbox/redimnet2-onnx
repo_name: mediainbox/redimnet2-onnx
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md

plugins:
  - search
  - mike:
      canonical_version: latest

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences

extra:
  version:
    provider: mike
