site_name: ReDimNet2 ONNX
site_description: ReDimNet2 speaker verification with ONNX
site_url: https://mediainbox.github.io/redimnet2-onnx/
repo_url: https://github.com/mediainbox/redimnet2-onnx
repo_name: mediainbox/redimnet2-onnx
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Models: models.md
  - API Reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: list
            members_order: source
            merge_init_into_class: true

            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

            separate_signature: true
            show_signature_annotations: true
            show_signature_type_parameters: true
            signature_crossrefs: true

            summary: true
            unwrap_annotated: true
            show_source: false

  - mike:
      canonical_version: latest

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra:
  version:
    provider: mike
